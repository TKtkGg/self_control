services:
  db:
    image: postgres:16
    container_name: selfcontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: self_control_user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: self_control
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: