services:
  db:
    image: postgres:16
    container_name: selfcontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: self_control_user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: self_control
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:8-alpine
    container_name: selfcontrol-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: